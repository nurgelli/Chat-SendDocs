<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 700px;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .status {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .status.connected {
            color: #90EE90;
        }
        
        .status.disconnected {
            color: #FFB6C6;
        }
        
        .login-form {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .login-form input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 10px;
            transition: border-color 0.3s;
        }
        
        .login-form input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .login-form button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .login-form button:hover {
            transform: translateY(-2px);
        }
        
        .login-form button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .chat-area {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-area.active {
            display: flex;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
            background: #f9f9f9;
        }
        
        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.own {
            display: flex;
            justify-content: flex-end;
        }
        
        .message.own .text {
            background: #667eea;
            color: white;
        }
        
        .message.other .text {
            background: #e0e0e0;
            color: black;
        }
        
        .message .text {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 12px;
            word-wrap: break-word;
            font-size: 14px;
        }
        
        .message .username {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
            font-weight: bold;
        }
        
        .input-area {
            padding: 15px 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        
        .input-area input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .input-area button {
            padding: 10px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        .input-area button:hover {
            transform: translateY(-2px);
        }
        
        .input-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .disconnect-btn {
            margin-top: 10px;
            padding: 8px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Chat</h1>
            <div class="status disconnected" id="status">Not connected</div>
        </div>
        
        <div class="login-form" id="loginForm">
            <input type="text" id="usernameInput" placeholder="Enter your name" maxlength="20">
            <button onclick="connectChat()">connect</button>
        </div>
        
        <div class="chat-area" id="chatArea">
            <div class="messages" id="messages"></div>
            <div class="input-area">
    <input type="file" id="fileInput" style="display: none;" onchange="handleFileUpload(event)">
    <button onclick="document.getElementById('fileInput').click()" style="background: #06e95d; padding: 10px 15px;">Upload</button>
    <input type="text" id="messageInput" placeholder="Write message" onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">Send</button>
</div>
            <button class="disconnect-btn" onclick="disconnect()">Exit</button>
        </div>
    </div>

    <script>
        let websocket = null;
        let username = '';
        let isConnected = false;

        function connectChat() {
            const usernameInput = document.getElementById('usernameInput');
            username = usernameInput.value.trim();

            if (!username) {
                alert('Please enter your username');
                return;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const url = `${protocol}//${window.location.host}/`;

            try {
                websocket = new WebSocket(url);

                websocket.onopen = () => {
                    isConnected = true;
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('chatArea').classList.add('active');
                    document.getElementById('status').textContent = 'Connected';
                    document.getElementById('status').classList.remove('disconnected');
                    document.getElementById('status').classList.add('connected');
                    document.getElementById('messages').innerHTML = '';
                    document.getElementById('messageInput').focus();

                    
                    websocket.send(JSON.stringify({
                        type: 'join',
                        username: username
                    }));
                };

                websocket.onmessage = (event) => {
                    const message = JSON.parse(event.data);
                    displayMessage(message);
                };

                websocket.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    alert('Connection error. Sunucu adresini kontrol edin.');
                    isConnected = false;
                };

                websocket.onclose = () => {
                    isConnected = false;
                    document.getElementById('status').textContent = 'not connected';
                    document.getElementById('status').classList.add('disconnected');
                    document.getElementById('status').classList.remove('connected');
                };

            } catch (error) {
                alert('Cant connect: ' + error);
                isConnected = false;
            }
        }

        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();

            if (!message || !isConnected) return;

            websocket.send(JSON.stringify({
                type: 'message',
                username: username,
                text: message
            }));

            messageInput.value = '';
            messageInput.focus();
        }

        
async function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file || !isConnected) return;

    const formData = new FormData();
    formData.append('file', file);

    try {
        const response = await fetch('/upload', {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();

        if (result.url) {
            websocket.send(JSON.stringify({
                type: 'file',
                username: username,
                text: 'Shared files:',
                fileUrl: result.url,
                fileName: result.filename
            }));
        }
    } catch (error) {
        console.error('File upload Error:', error);
        alert('Dosya yüklenemedi.');
    } finally {
        event.target.value = ''; 
    }
}

function displayMessage(data) {
    const messagesDiv = document.getElementById('messages');
    const messageElement = document.createElement('div');
    messageElement.className = 'message ' + (data.username === username ? 'own' : 'other');

    const usernameElement = document.createElement('div');
    usernameElement.className = 'username';
    usernameElement.textContent = data.username;

    const textElement = document.createElement('div');
    textElement.className = 'text';
    
    // Mesajın türünü kontrol et
    if (data.type === 'file') {
        textElement.innerHTML = `${data.text} <br><br> <a href="${data.fileUrl}" target="_blank" download style="color: inherit; font-weight: bold; text-decoration: underline;">📄 ${data.fileName}</a>`;
        textElement.style.background = (data.username === username) ? '#4a55a2' : '#d0d0d0';
    } else {
        textElement.textContent = data.text;
    }

    messageElement.appendChild(usernameElement);
    messageElement.appendChild(textElement);
    messagesDiv.appendChild(messageElement);

    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function disconnect() {
            if (websocket) {
                websocket.close();
            }
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('chatArea').classList.remove('active');
            document.getElementById('usernameInput').value = '';
            document.getElementById('usernameInput').focus();
        }

        
        document.getElementById('usernameInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                connectChat();
            }
        });
    </script>
</body>
</html>
